# Read-only check that the Google secrets of this repository work (backend/app/modules/requests/google_check.py).
# The same secrets/variables are what a server deploy passes to the backend as environment variables.
name: google-access

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/google-access.yml
      - backend/app/modules/requests/google_*.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ERP_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.ERP_GOOGLE_SERVICE_ACCOUNT_JSON }}
      ERP_KD_DRIVE_OAUTH_JSON: ${{ secrets.ERP_KD_DRIVE_OAUTH_JSON }}
      # «!Проекты» (SUPPLYMAP КД root, owner artemiyfraxis@gmail.com). Not a secret; a repository variable overrides it.
      ERP_KD_DRIVE_FOLDER_ID: ${{ vars.ERP_KD_DRIVE_FOLDER_ID || '1cPlM5X6ZSdiPpSajOw1YvBYfOdqGdzfA' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock.txt
        working-directory: backend
      - run: python -m app.modules.requests.google_check
        working-directory: backend
