# The repo gate (`npm run check`) on every PR and every push to main, minus the architecture tests:
# those pin SOURCE.json to the sibling SUPPLYMAP checkout (private repo, moves daily), so they stay
# a local/thread check. Everything else runs here: backend pytest, frontend tests, build.
name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.lock.txt
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Script syntax
        run: |
          node --check scripts/sync-techcards.mjs
          node --check scripts/sync-techcard-library.mjs
          node --check scripts/run-backend-tests.mjs
      - name: Backend tests
        run: npm run test:backend
      - name: Frontend tests and build
        run: npm run test:frontend
