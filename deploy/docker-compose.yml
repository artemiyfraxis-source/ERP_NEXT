# Production stack on one Ubuntu machine: PostgreSQL + API (serves the site) + outbox worker + Caddy (HTTPS) + nightly backups.
# Always run through deploy/erp.sh: it passes --env-file ${ERP_HOME}/config/.env (see README.md).
# Layout on the server (ERP_HOME=/opt/erp): app/ (this repo), config/.env + config/secrets/, supplymap/, import/, backups/.
name: erp

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Tuned for the shop server (26.10.2026: 24 cores, 63 GB RAM, NVMe SSD under /var/lib/docker), README.md «Ядра и
    # память». Each value can be changed in config/.env (PG_*), then `./erp.sh up -d db`. The rehearsal stack
    # (docker-compose.rehearsal.yml) and CI keep PostgreSQL's defaults. max_connections covers the pools:
    # ERP_API_WORKERS × (ERP_DB_POOL_SIZE + ERP_DB_MAX_OVERFLOW) + worker + CLIs (backend/tests/test_deploy_capacity.py).
    command:
      - postgres
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-8GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-40GB}
      - -c
      - work_mem=${PG_WORK_MEM:-32MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST:-1.1}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY:-200}
      - -c
      - max_worker_processes=${PG_MAX_WORKER_PROCESSES:-24}
      - -c
      - max_parallel_workers=${PG_MAX_PARALLEL_WORKERS:-16}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-4}
      - -c
      - max_parallel_maintenance_workers=${PG_MAX_PARALLEL_MAINTENANCE_WORKERS:-4}
      - -c
      - wal_buffers=${PG_WAL_BUFFERS:-16MB}
      - -c
      - min_wal_size=${PG_MIN_WAL_SIZE:-1GB}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_completion_target=0.9
    # Parallel queries share memory through /dev/shm: Docker's 64 MB would fail them with «could not resize shared
    # memory segment». shared_buffers itself is not there (mmap).
    shm_size: ${PG_SHM_SIZE:-1g}
    # A clean stop writes a shutdown checkpoint; 10 s may cut it and force crash recovery on the next start.
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: { context: .., dockerfile: Dockerfile }
    image: erp-next:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    env_file: ${ERP_HOME:-/opt/erp}/config/.env
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://erp:${POSTGRES_PASSWORD}@db:5432/erp
      ERP_COOKIE_SECURE: ${ERP_COOKIE_SECURE:-1}
      # 0: the API never migrates on start (update.sh does, after a backup and a rehearsal); bootstrap.sh passes 1
      # only for a first install on an empty database.
      ERP_AUTO_MIGRATE: ${ERP_AUTO_MIGRATE:-0}
      SUPPLYMAP_SOURCE_REPOSITORY: /opt/supplymap
      ERP_DEVICE_LOG_DIR: /app/data/import/devices
      # uvicorn worker processes (backend/docker-entrypoint.sh); 1 = one process, as before 26.10.2026. Each process has
      # its own pool of ERP_DB_POOL_SIZE + ERP_DB_MAX_OVERFLOW connections — db max_connections must cover them all.
      ERP_API_WORKERS: ${ERP_API_WORKERS:-8}
      ERP_DB_POOL_SIZE: ${ERP_DB_POOL_SIZE:-5}
      ERP_DB_MAX_OVERFLOW: ${ERP_DB_MAX_OVERFLOW:-10}
    volumes:
      - ${ERP_HOME:-/opt/erp}/config/secrets:/run/erp-secrets:ro
      - ${ERP_HOME:-/opt/erp}/supplymap:/opt/supplymap:ro
      - ${ERP_HOME:-/opt/erp}/import:/app/data/import
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    # The workers finish their requests on a stop (uvicorn --timeout-graceful-shutdown 20) before Docker kills them.
    stop_grace_period: 30s

  worker:
    image: erp-next:latest
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    env_file: ${ERP_HOME:-/opt/erp}/config/.env
    environment:
      ERP_DATABASE_URL: postgresql+psycopg://erp:${POSTGRES_PASSWORD}@db:5432/erp
    volumes:
      - ${ERP_HOME:-/opt/erp}/config/secrets:/run/erp-secrets:ro
    command: ["python", "-m", "app.outbox_worker"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [api]
    ports: ["80:80", "${ERP_HTTPS_PUBLISH:-443}:443"]
    environment:
      ERP_DOMAIN: ${ERP_DOMAIN:?set ERP_DOMAIN in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ERP_HOME:-/opt/erp}/status:/srv/status:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGHOST: db
      PGUSER: erp
      PGDATABASE: erp
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Moscow
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      KEEP_DAILY: ${KEEP_DAILY:-7}
      KEEP_WEEKLY: ${KEEP_WEEKLY:-0}
      KEEP_MONTHLY: ${KEEP_MONTHLY:-0}
      # Daytime dumps into backups/intraday (owner, 10.10.2026): at most 3 hours of work lost.
      BACKUP_INTRADAY_HOURS: ${BACKUP_INTRADAY_HOURS-9 12 15 18 21}
      KEEP_INTRADAY: ${KEEP_INTRADAY:-15}
      # Freshness: the container turns unhealthy (./erp.sh ps) when the last dump failed or the last good one is older.
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      BACKUP_MIN_FREE_MB: ${BACKUP_MIN_FREE_MB:-1024}
      BACKUP_RETRY_MINUTES: ${BACKUP_RETRY_MINUTES:-60}
    volumes:
      - ./backup-loop.sh:/backup-loop.sh:ro
      - ${ERP_HOME:-/opt/erp}/backups:/backups
    entrypoint: ["bash", "/backup-loop.sh"]
    healthcheck:
      # backups/backup-status.json: last attempt ok and last good dump younger than BACKUP_MAX_AGE_HOURS.
      test: ["CMD", "bash", "/backup-loop.sh", "--health"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 1h   # a stale status means a dump right at start

volumes:
  pgdata:
  caddy_data:
  caddy_config:
